name: ARC Windows
on:
  workflow_dispatch:
  push:
    branches: [main, arc/main]
  pull_request:
permissions:
  contents: read
jobs:
  windows:
    name: Windows Server 2022 build and packaged smoke
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      TURBO_CONCURRENCY: "1"
      NODE_OPTIONS: --max-old-space-size=4096
      UV_THREADPOOL_SIZE: "2"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24.14.0"
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - name: Check desktop and bundled app versions
        run: node .github/workflows/check-version-lockstep.mjs
      - name: Install workspace
        run: pnpm install --frozen-lockfile
      - name: Verify native desktop foundation
        run: pnpm exec turbo run typecheck test --filter=@bb/domain --filter=@bb/process-utils --filter=@bb/desktop --output-logs=errors-only
      - name: Verify native PowerShell and ConPTY
        run: pnpm exec turbo run test --filter=@bb/host-daemon --output-logs=errors-only '--' src/terminals/windows-conpty.test.ts
      - name: Verify native Unicode file watching
        run: pnpm exec turbo run test --filter=@bb/host-watcher --output-logs=errors-only '--' test/windows-watch.test.ts
      - name: Verify owned Windows process identity and cleanup
        run: pnpm exec turbo run test --filter=@bb/config --output-logs=errors-only '--' test/windows-verified-process-stop.test.ts
      - name: Verify provider onboarding contracts without credentials
        run: pnpm exec turbo run test --filter=bb-plugin-provider-codex --filter=bb-plugin-provider-claude-code --filter=bb-plugin-provider-pi --filter=bb-plugin-provider-acp --output-logs=errors-only '--' src/bridge/codex-login.test.ts src/bridge/provider-maintenance.test.ts src/agents.test.ts src/probe-capabilities.test.ts
      - name: Package desktop and installer for verification
        run: pnpm exec turbo run dist:windows --filter=@bb/desktop
      - name: Exercise the packaged Windows application and restart
        timeout-minutes: 15
        shell: pwsh
        run: |
          $env:TEMP = $env:RUNNER_TEMP
          $env:TMP = $env:RUNNER_TEMP
          node apps/desktop/scripts/smoke-arc-windows.mjs | Tee-Object -FilePath "$env:RUNNER_TEMP/arc-packaged-smoke.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ARC-Windows-verification
          path: |
            ${{ runner.temp }}/arc-packaged-smoke.log
            ${{ runner.temp }}/ARC packaged smoke*/result.json
            ${{ runner.temp }}/ARC packaged smoke*/electron.log
            apps/desktop/.turbo/turbo-test.log
            apps/host-daemon/.turbo/turbo-test.log
            packages/process-utils/.turbo/turbo-test.log
          include-hidden-files: true
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        with:
          name: ARC-Windows-x64-validation-only
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
          if-no-files-found: error
