name: ARC Personal Release Verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arc-personal-release-verification
  cancel-in-progress: false

jobs:
  verify:
    if: github.repository == 'grandmasterhilbertporcupine/ARC-IDE'
    runs-on: windows-2022
    timeout-minutes: 150
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      BB_DESKTOP_RELEASE_CHANNEL: latest
      TURBO_CONCURRENCY: "1"
      NODE_OPTIONS: --max-old-space-size=4096
      UV_THREADPOOL_SIZE: "2"
      npm_config_jobs: "1"
      CMAKE_BUILD_PARALLEL_LEVEL: "1"
      MAX_JOBS: "1"
      TURBO_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "24.14.0"
      - uses: pnpm/action-setup@v6
        with:
          version: 9.15.0
      - name: Validate release version
        shell: pwsh
        run: |
          node .github/workflows/check-version-lockstep.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $version = (Get-Content apps/desktop/package.json | ConvertFrom-Json).version
          if ($version -notmatch '^\d+\.\d+\.\d+$') { throw 'Personal release requires a stable version.' }
          if ($env:GITHUB_REF_TYPE -eq 'tag' -and $env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag and package version must agree.' }
      - name: Install workspace serially
        run: pnpm install --frozen-lockfile --child-concurrency=1 --network-concurrency=4
      - name: Verify the committed MVP source
        run: pnpm run verify:mvp
      - name: Build a fresh installer bound to verified source
        run: pnpm run release:build
      - name: Exercise packaged teams, managed Preview, security, and installer options
        run: pnpm run verify:mvp:packaged
      - name: Verify installed payload, launch, reinstall, and uninstall
        run: pnpm run release:verify-installer
      - name: Finalize verified local assets
        run: pnpm run release:assets
      - name: Retain verification evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ARC-personal-release-evidence
          path: |
            .arc-verification/mvp/**/*.log
            .arc-verification/mvp/**/*.json
            .arc-verification/mvp/**/*.png
            .arc-verification/NSIS install */**/*.json
            .arc-verification/NSIS install */**/*.log
            .arc-verification/NSIS install */**/*.png
            apps/desktop/.turbo/*.log
          include-hidden-files: true
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        with:
          name: ARC-personal-release-assets
          path: |
            apps/desktop/release/*.exe
            apps/desktop/release/*.blockmap
            apps/desktop/release/*.yml
            apps/desktop/release/*.json
            apps/desktop/release/*.sha256
            apps/desktop/release/*.install.txt
            apps/desktop/release/SHA256SUMS
            apps/desktop/release/verification-logs/**
          if-no-files-found: error
